<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">LVMH recovered analytical workflow</title><desc id="desc">Private price data leads to full-series ARIMA and a separately corrected lagged regression. Their error measures use different evaluation samples.</desc><rect width="1000" height="360" fill="#f4f2eb"/><g fill="#233b39" font-family="Arial" font-size="21"><text x="40" y="55" font-size="28">Two analyses. Two evaluation contexts.</text><text x="40" y="100" font-size="16">Workflow recovered from source • no performance results reproduced</text><rect x="40" y="145" width="230" height="120" rx="8" fill="#e1e8df"/><text x="65" y="192">Authorized daily</text><text x="65" y="224">LVMUY prices</text><path d="M280 200 L350 200 M335 190 L350 200 L335 210" stroke="#233b39" fill="none" stroke-width="2"/><text x="390" y="168">Full-series ARIMA → 60-step forecast</text><text x="390" y="198" font-size="16">Residual RMSE: in-sample</text><text x="390" y="250">Lag5 + Volume → chronological 80/20</text><text x="390" y="280" font-size="16">Test RMSE: corrected regression only</text><text x="40" y="330" font-size="15">The two RMSE values are not a common-test model comparison.</text></g></svg>
